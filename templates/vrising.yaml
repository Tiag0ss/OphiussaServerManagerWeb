id: vrising
name: V Rising
description: V Rising dedicated server — world name, PvP/PvE, clan size and host settings
runtime:
  image: trueosiris/vrising
  stopTimeout: 60
  memoryMb: 6144
  cpuLimit: 2
  ports:
    - { key: game, container: 9876, protocol: udp }
    - { key: query, container: 9877, protocol: udp }
    - { key: rcon, container: 25575, protocol: tcp }
  volumes:
    - { key: data, container: /vrising/server-data }
  files:
    - path: Settings/ServerHostSettings.json
      format: json
    - path: Settings/ServerGameSettings.json
      format: json
  env:
    TZ: Europe/Lisbon
  backup:
    include:
      - Settings
      - Saves
rcon:
  enabled: true
  portKey: rcon
  passwordField: rconPassword
  saveCommand: save
mods:
  providers: [thunderstore]
  thunderstoreNamespace: v-rising
  installPath: BepInEx/plugins
options:
  gameMode:
    - { value: PvE, label: PvE }
    - { value: PvP, label: PvP }
  castleHeartDamage:
    - { value: Always, label: Always }
    - { value: Never, label: Never }
    - { value: TimeRestricted, label: Time restricted }
fields:
  - key: serverName
    type: string
    group: Server
    label: Server name
    required: true
    default: My V Rising Server
    bind: { env: SERVERNAME, json: Name }
  - key: worldName
    type: string
    group: World
    label: World / save name
    required: true
    default: world1
    description: Save folder name under persistent data
    bind: { env: WORLDNAME }
  - key: password
    type: string
    group: Server
    label: Password
    secret: true
    default: ""
    bind: { env: SERVERPASSWORD, json: Password }
  - key: maxUsers
    type: number
    group: Server
    label: Max players
    min: 1
    max: 40
    default: 40
    bind: { env: MAXUSERS, json: MaxConnectedUsers }
  - key: maxAdmins
    type: number
    group: Server
    label: Max connected admins
    min: 1
    max: 40
    default: 4
    advanced: true
    bind: { env: HOST_SETTINGS_MaxConnectedAdmins }
  - key: serverDescription
    type: string
    group: Server
    label: Server description
    default: ""
    advanced: true
    bind: { env: HOST_SETTINGS_Description }
  - key: secure
    type: boolean
    group: Server
    label: VAC protection
    default: true
    advanced: true
    bind: { env: HOST_SETTINGS_Secure, trueFalse: true }
  - key: listOnSteam
    type: boolean
    group: Server
    label: List on Steam
    default: false
    bind: { env: HOST_SETTINGS_ListOnSteam, trueFalse: true }
  - key: listOnEOS
    type: boolean
    group: Server
    label: List on EOS / crossplay browser
    default: false
    bind: { env: HOST_SETTINGS_ListOnEOS, trueFalse: true }
  - key: useRcon
    type: boolean
    group: Server
    label: Enable RCON
    description: "Kept on by default (image default is off) — the panel needs RCON for graceful save/stop and health checks"
    default: true
    bind: { json: Rcon.Enabled }
  - key: rconPassword
    type: string
    group: Server
    label: RCON password
    secret: true
    default: changeme
    showIf: { field: useRcon, equals: true }
    bind: { env: RCONPASSWORD, json: Rcon.Password }
  - key: gameMode
    type: select
    group: Rules
    label: Game mode
    optionsFrom: gameMode
    default: PvP
    bind: { env: GAME_SETTINGS_GameModeType }
  - key: gameDifficulty
    type: select
    group: Rules
    label: Boss difficulty
    default: Normal
    options:
      - { value: Relaxed, label: Relaxed }
      - { value: Normal, label: Normal }
      - { value: Hard, label: Hard }
    bind: { env: GAME_SETTINGS_GameDifficulty }
  - key: clanSize
    type: number
    group: Rules
    label: Clan size
    min: 1
    max: 50
    default: 4
    bind: { env: GAME_SETTINGS_ClanSize }
  - key: playerDamageMode
    type: select
    group: Rules
    label: PvP damage window
    default: Always
    advanced: true
    showIf: { field: gameMode, equals: PvP }
    options:
      - { value: Always, label: Always }
      - { value: TimeRestricted, label: Time restricted }
    bind: { env: GAME_SETTINGS_PlayerDamageMode }
  - key: pvpProtectionMode
    type: select
    group: Rules
    label: New player PvP protection
    default: Medium
    advanced: true
    showIf: { field: gameMode, equals: PvP }
    options:
      - { value: Disabled, label: Disabled }
      - { value: VeryShort, label: Very short }
      - { value: Short, label: Short }
      - { value: Medium, label: Medium }
      - { value: Long, label: Long }
    bind: { env: GAME_SETTINGS_PvPProtectionMode }
  - key: dayDuration
    type: slider
    group: World
    label: Day duration (seconds)
    min: 300
    max: 3600
    step: 60
    default: 1080
    bind: { env: GAME_SETTINGS_DayDurationInSeconds }
  - key: bloodBoundEquipment
    type: boolean
    group: World
    label: Equipment is blood-bound (no drop/trade)
    default: true
    advanced: true
    bind: { env: GAME_SETTINGS_BloodBoundEquipment, trueFalse: true }
  - key: castleDamageMode
    type: select
    group: Rules
    label: Castle damage window
    optionsFrom: castleHeartDamage
    default: Never
    advanced: true
    showIf: { field: gameMode, equals: PvP }
    bind: { env: GAME_SETTINGS_CastleDamageMode }
  - key: castleHeartDamageMode
    type: select
    group: Rules
    label: Castle heart destruction rule
    default: CanBeDestroyedByPlayers
    advanced: true
    options:
      - { value: CanBeDestroyedOnlyWhenDecaying, label: Only when decaying }
      - { value: CanBeDestroyedByPlayers, label: By players }
      - { value: CanBeSeizedOrDestroyedByPlayers, label: Seized or destroyed by players }
    bind: { env: GAME_SETTINGS_CastleHeartDamageMode }
  - key: castleDecayRateModifier
    type: slider
    group: Rates
    label: Castle decay rate
    min: 0
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_CastleDecayRateModifier }
  - key: teleportBoundItems
    type: boolean
    group: Rules
    label: Allow teleport with bound items
    default: true
    advanced: true
    bind: { env: GAME_SETTINGS_TeleportBoundItems, trueFalse: true }
  - key: inventoryStacksModifier
    type: slider
    group: Rates
    label: Inventory stack size
    min: 0.25
    max: 3
    step: 0.25
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_InventoryStacksModifier }
  - key: dropTableModifier
    type: slider
    group: Rates
    label: Drop table modifier
    min: 0.25
    max: 3
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_DropTableModifier_General }
  - key: craftRateModifier
    type: slider
    group: Rates
    label: Crafting speed
    min: 0.1
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_CraftRateModifier }
  - key: materialYieldModifier
    type: slider
    group: Rates
    label: Material yield
    min: 0.5
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_MaterialYieldModifier }
  - key: bloodEssenceYield
    type: slider
    group: Rates
    label: Blood essence yield
    min: 0.5
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_BloodEssenceYieldModifier }
  - key: sunDamageModifier
    type: slider
    group: Rates
    label: Sun damage
    min: 0
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_SunDamageModifier }
  - key: durabilityLoss
    type: slider
    group: Rates
    label: Durability loss
    min: 0
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_DurabilityModifier }
  - key: vampireMaxHealthModifier
    type: slider
    group: Combat
    label: Vampire max health
    min: 0.1
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: "GAME_SETTINGS_VampireStatModifiers__MaxHealthModifier" }
  - key: vampirePhysicalPowerModifier
    type: slider
    group: Combat
    label: Vampire physical power
    min: 0.1
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: "GAME_SETTINGS_VampireStatModifiers__PhysicalPowerModifier" }
  - key: vampireSpellPowerModifier
    type: slider
    group: Combat
    label: Vampire spell power
    min: 0.1
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: "GAME_SETTINGS_VampireStatModifiers__SpellPowerModifier" }
  - key: bloodDrainModifier
    type: slider
    group: Survival
    label: Blood drain rate
    min: 0.1
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: GAME_SETTINGS_BloodDrainModifier }
  - key: compressSaveFiles
    type: boolean
    group: Maintenance
    label: Compress save files
    default: true
    advanced: true
    bind: { env: HOST_SETTINGS_CompressSaveFiles, trueFalse: true }
  - key: resetDaysInterval
    type: number
    group: Maintenance
    label: Auto-wipe interval (days, 0 = off)
    min: 0
    max: 365
    default: 0
    advanced: true
    bind: { env: HOST_SETTINGS_ResetDaysInterval }
  - key: logDays
    type: number
    group: Maintenance
    label: Keep log files (days)
    min: 1
    max: 90
    default: 30
    advanced: true
    bind: { env: LOGDAYS }
