id: ark-asa
name: ARK Survival Ascended
description: ARK ASA dedicated server (Proton) — maps, CurseForge mods, RCON
runtime:
  image: sknnr/ark-ascended-server
  stopTimeout: 120
  memoryMb: 12288
  cpuLimit: 4
  restartPolicy: unless-stopped
  ports:
    - { key: game, container: 7777, protocol: udp, listenEnv: GAME_PORT, matchHost: true }
    - { key: rcon, container: 27020, protocol: tcp, listenEnv: RCON_PORT, matchHost: true }
  volumes:
    - { key: data, container: /home/steam/ark/ShooterGame/Saved }
  env:
    TZ: Europe/Lisbon
  backup:
    include:
      - SavedArks
      - Config
      - Logs
    exclude:
      - steamapps
rcon:
  enabled: true
  portKey: rcon
  passwordField: serverAdminPassword
  saveCommand: saveworld
mods:
  providers: [curseforge]
  curseforgeGameId: 83374
  installPath: Mods
  bind: { env: MODS, join: "," }
options:
  maps:
    - { value: TheIsland_WP, label: The Island }
    - { value: ScorchedEarth_WP, label: Scorched Earth }
    - { value: TheCenter_WP, label: The Center }
    - { value: Aberration_WP, label: Aberration }
    - { value: Extinction_WP, label: Extinction }
    - { value: Ragnarok_WP, label: Ragnarok }
    - { value: Astraeos_WP, label: Astraeos }
    - { value: Valguero_WP, label: Valguero }
    - { value: LostColony_WP, label: Lost Colony }
fields:
  - key: sessionName
    type: string
    group: Server
    label: Session name
    required: true
    default: ARK Ascended Server
    bind: { env: SESSION_NAME }
  - key: map
    type: select
    group: Server
    label: Map
    optionsFrom: maps
    default: TheIsland_WP
    required: true
    bind: { env: SERVER_MAP }
  - key: serverPassword
    type: string
    group: Access
    label: Join password
    secret: true
    default: ""
    bind: { env: SERVER_PASSWORD }
  - key: serverAdminPassword
    type: string
    group: Access
    label: Admin password
    secret: true
    required: true
    default: changeme
    bind: { env: SERVER_ADMIN_PASSWORD }
  - key: pve
    type: boolean
    group: Rules
    label: PvE mode
    default: false
    bind: { env: EXTRA_SETTINGS, queryParam: ServerPVE }
  - key: serverHardcore
    type: boolean
    group: Rules
    label: Hardcore mode
    description: Characters are deleted on death
    default: false
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: ServerHardcore }
  - key: overrideOfficialDifficulty
    type: slider
    group: Rules
    label: Max difficulty (wild dino level cap)
    description: "5 = level 150 wild dinos (common non-official default)"
    min: 1
    max: 10
    step: 0.5
    default: 5
    bind: { env: EXTRA_SETTINGS, queryParam: OverrideOfficialDifficulty }
  - key: xpMultiplier
    type: slider
    group: Rules
    label: XP multiplier
    min: 1
    max: 10
    step: 0.5
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: XPMultiplier }
  - key: tamingSpeed
    type: slider
    group: Rules
    label: Taming speed
    min: 1
    max: 50
    step: 0.5
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: TamingSpeedMultiplier }
  - key: harvestAmount
    type: slider
    group: Rules
    label: Harvest amount
    min: 1
    max: 20
    step: 0.5
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: HarvestAmountMultiplier }
  - key: matingInterval
    type: slider
    group: Rules
    label: Mating interval
    min: 0.1
    max: 3
    step: 0.1
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: MatingIntervalMultiplier }
  - key: babyMatureSpeed
    type: slider
    group: Rules
    label: Baby mature speed
    min: 1
    max: 100
    step: 1
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: BabyMatureSpeedMultiplier }
  - key: eggHatchSpeed
    type: slider
    group: Rules
    label: Egg hatch speed
    min: 1
    max: 100
    step: 1
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: EggHatchSpeedMultiplier }
  - key: cropGrowthSpeed
    type: slider
    group: Rules
    label: Crop growth speed
    min: 1
    max: 50
    step: 1
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: CropGrowthSpeedMultiplier }
  - key: dinoCount
    type: slider
    group: Rules
    label: Dino count
    min: 0.5
    max: 5
    step: 0.1
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: DinoCountMultiplier }
  - key: preventOfflinePvP
    type: boolean
    group: Rules
    label: Prevent offline PvP
    description: Protects offline players' structures/dinos from raiding (off by default in vanilla ARK)
    default: false
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: PreventOfflinePvP }
  - key: disableStructureDecayPvE
    type: boolean
    group: Rules
    label: Disable structure decay (PvE)
    default: false
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: DisableStructureDecayPvE }
  - key: allowCaveBuildingPvE
    type: boolean
    group: Rules
    label: Allow cave building (PvE)
    default: false
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: AllowCaveBuildingPvE }
  - key: itemStackSizeMultiplier
    type: slider
    group: Rules
    label: Item stack size multiplier
    min: 1
    max: 100
    step: 1
    default: 1
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: ItemStackSizeMultiplier }
  - key: globalVoiceChat
    type: boolean
    group: Rules
    label: Global voice chat
    default: true
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: GlobalVoiceChat }
  - key: proximityChat
    type: boolean
    group: Rules
    label: Proximity chat
    default: true
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: ProximityChat }
  - key: serverCrosshair
    type: boolean
    group: Rules
    label: Show crosshair
    default: false
    advanced: true
    bind: { env: EXTRA_SETTINGS, queryParam: ServerCrosshair }
  - key: extraSettings
    type: text
    group: Server
    label: Extra settings (advanced escape hatch)
    advanced: true
    default: ""
    description: "For anything not covered above. ? separated, e.g. ?SomeSetting=True?Other=5"
    bind: { env: EXTRA_SETTINGS, rawAppend: true }
  - key: extraFlags
    type: text
    group: Server
    label: Extra flags
    advanced: true
    default: ""
    description: "Space-separated, e.g. -NoBattlEye -ForceAllowCaveFlyers"
    bind: { env: EXTRA_FLAGS }
